<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Czarlina - Mapa Interaktywna</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
*, *::before, *::after { transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
#map, #map *, .domek-icon, .leaflet-container * { transition: none !important; }

/* ── CRT DARK (default) ───────────────────────────────────────── */
:root {
  --bg: #0a0e1a;
  --bg-elevated: #0f1525;
  --border: #1e293b;
  --border-active: #334155;
  --text: #cbd5e1;
  --text-dim: #64748b;
  --accent-teal: #5eead4;
  --accent-teal-dim: #2dd4bf;
  --accent-orange: #f97316;
  --accent-purple: #a78bfa;
  --highlight: #fde047;
  --danger: #ef4444;
  --map-image-filter: brightness(0.55) contrast(1.08) saturate(0.85) hue-rotate(-10deg);
  --glow: 1;
  --row-hover: rgba(94, 234, 212, 0.06);
  --row-selected: rgba(249, 115, 22, 0.14);
}

/* ── CRT LIGHT (stonowany) ────────────────────────────────────── */
body.light-mode {
  --bg: #f4f5ef;
  --bg-elevated: #ffffff;
  --border: #d4dbe2;
  --border-active: #94a3b8;
  --text: #1e293b;
  --text-dim: #64748b;
  --accent-teal: #0d9488;
  --accent-teal-dim: #14b8a6;
  --accent-orange: #ea580c;
  --accent-purple: #7c3aed;
  --highlight: #ca8a04;
  --danger: #dc2626;
  --map-image-filter: brightness(0.96) contrast(1.04) saturate(0.9);
  --glow: 0;
  --row-hover: rgba(13, 148, 136, 0.06);
  --row-selected: rgba(234, 88, 12, 0.12);
}

body {
  font-family: 'JetBrains Mono', 'Fira Code', Menlo, monospace;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  --marker-zoom-scale: 1;
  position: relative;
}

/* ── SCANLINES OVERLAY ────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(94, 234, 212, 0.05) 0px,
    rgba(94, 234, 212, 0.05) 1px,
    transparent 1px,
    transparent 3px
  );
  opacity: calc(0.45 * var(--glow));
  z-index: 9999;
  mix-blend-mode: overlay;
}

/* ── HEADER ──────────────────────────────────────────────────── */
header {
  background: var(--bg);
  color: var(--text);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 1px solid var(--accent-teal);
  z-index: 10;
}

header h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--accent-teal);
  text-shadow: 0 0 calc(8px * var(--glow)) currentColor;
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

header h1 .h-bracket { color: var(--accent-teal-dim); }
header h1 .h-sep { color: var(--text-dim); margin: 0 4px; font-weight: 400; }
header h1 .h-sub {
  color: var(--text-dim);
  font-weight: 400;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-shadow: none;
}

.header-actions { display: flex; gap: 8px; align-items: center; }

/* ── BRACKETED CHROME (clickable) ─────────────────────────────── */
.bracketed {
  position: relative;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--accent-teal);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  padding: 6px 12px;
  border-radius: 3px;
  letter-spacing: 0.02em;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.bracketed::before { content: '['; margin-right: 6px; color: var(--text-dim); transition: color 0.15s; }
.bracketed::after  { content: ']'; margin-left: 6px;  color: var(--text-dim); transition: color 0.15s; }

.bracketed:hover {
  border-color: var(--accent-orange);
  color: var(--accent-orange);
  background: rgba(249, 115, 22, 0.06);
}
.bracketed:hover::before, .bracketed:hover::after { color: var(--accent-orange); }

.bracketed.active {
  border-color: var(--accent-teal);
  color: var(--accent-teal);
  background: rgba(94, 234, 212, 0.08);
}

.bracketed:focus-visible {
  outline: none;
  border-color: var(--accent-teal);
  box-shadow: 0 0 0 2px rgba(94, 234, 212, 0.3);
}

#btnThemeToggle, #btnHelp {
  width: 36px; min-width: 36px; padding: 0;
}
#btnThemeToggle svg { width: 16px; height: 16px; }
#btnThemeToggle svg * { stroke: currentColor; }

/* ── LAYOUT ─────────────────────────────────────────────────── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-width: 0;
  background: var(--bg);
  padding: 16px;
  gap: 14px;
  position: relative;
}

/* ── SECTION CHROME — ramka z etykietą w rogu ─────────────────── */
.section-chrome {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-elevated);
}
.section-chrome[data-label]::before {
  content: attr(data-label);
  position: absolute;
  top: -9px;
  left: 14px;
  background: var(--bg);
  padding: 0 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent-teal);
  z-index: 2;
  pointer-events: none;
}

/* ── MAP PANEL ────────────────────────────────────────────────── */
.map-panel {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-width: 0;
  width: 100%;
  transition: width 0.22s ease, flex-basis 0.22s ease;
  overflow: hidden;
}

.map-toolbar {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  align-items: center;
  flex-shrink: 0;
}

.search-wrap { position: relative; flex: 1; min-width: 0; }
.toolbar-actions { display: flex; gap: 8px; align-items: center; }

.search-wrap::before {
  content: '>';
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent-teal);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  pointer-events: none;
  font-size: 0.95rem;
}

.search-wrap input {
  width: 100%;
  padding: 8px 34px 8px 28px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 16px;
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg);
  color: var(--text);
}
.search-wrap input:focus {
  outline: none;
  border-color: var(--accent-teal);
  box-shadow: 0 0 0 2px rgba(94, 234, 212, 0.18);
}
.search-wrap input::placeholder { color: var(--text-dim); }

#clearSearch {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  background: none; border: none; font-size: 1.2rem; cursor: pointer;
  color: var(--text-dim); display: none; line-height: 1;
  width: 28px; height: 28px; padding: 0;
}
#clearSearch:hover { color: var(--accent-orange); }

/* Counter w toolbar (UX #3) */
.toolbar-counter {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: var(--text-dim);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px;
}
.toolbar-counter .prompt { color: var(--accent-teal); animation: blink 1.4s steps(2, end) infinite; }
.toolbar-counter .num { color: var(--accent-teal); font-weight: 600; }
.toolbar-counter.filtered .num { color: var(--accent-orange); }
.toolbar-counter .lbl { color: var(--text-dim); }

@keyframes blink {
  0%, 50% { opacity: 1; }
  50.01%, 100% { opacity: 0.25; }
}

#map {
  flex: 1;
  background: var(--bg);
}

/* Option B: przyciemnij obraz overlay */
.leaflet-image-layer { filter: var(--map-image-filter); }

.leaflet-container { font-family: 'JetBrains Mono', monospace; }

/* Leaflet kontrolki — CRT (bez bracketów, klikalność jasna) */
.leaflet-bar, .leaflet-control {
  border: 1px solid var(--border) !important;
  background: var(--bg-elevated) !important;
  box-shadow: none !important;
  border-radius: 3px !important;
}
.leaflet-bar a, .leaflet-bar a:link, .leaflet-bar a:visited {
  background-color: var(--bg-elevated);
  color: var(--accent-teal);
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  width: 32px; height: 32px; line-height: 32px;
}
.leaflet-bar a:hover {
  background-color: var(--bg);
  color: var(--accent-orange);
}
.leaflet-bar a:first-child { border-top-left-radius: 3px; border-top-right-radius: 3px; }
.leaflet-bar a:last-child  { border-bottom: none; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }
.leaflet-bar a.leaflet-disabled {
  background-color: var(--bg-elevated);
  color: var(--text-dim);
  cursor: default;
}

/* ── MAP FOOTER (legenda) ─────────────────────────────────────── */
.map-footer {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 12px;
  background: var(--bg-elevated);
  border-top: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  align-items: center;
  flex-shrink: 0;
  color: var(--text-dim);
}
.map-footer .legend-hint {
  color: var(--text-dim);
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-right: 4px;
}

button.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.74rem;
  color: var(--text);
  min-height: 30px;
  transition: all 0.15s;
}
button.legend-item:hover {
  border-color: var(--accent-orange);
  color: var(--accent-orange);
}
button.legend-item.disabled {
  opacity: 0.4;
  text-decoration: line-through;
  border-style: dashed;
}
.legend-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  border: 1px solid var(--border-active);
  flex-shrink: 0;
}
button.legend-item b { color: var(--accent-teal); margin-right: 2px; font-weight: 600; }
button.legend-item.disabled b { color: var(--text-dim); }

/* ── TABLE PANEL ─────────────────────────────────────────────── */
.table-panel {
  flex: 0 0 var(--table-panel-width, 360px);
  display: flex;
  flex-direction: column;
  width: var(--table-panel-width, 360px);
  max-width: calc(100vw - 180px);
  overflow: hidden;
  min-width: 0;
  transition: width 0.22s ease, flex-basis 0.22s ease, opacity 0.22s ease, border-color 0.22s ease;
}

.table-panel.collapsed {
  flex-basis: 0;
  width: 0;
  border-color: transparent;
  opacity: 0;
}
.table-panel.collapsed::before { opacity: 0; }
.table-panel.collapsed .table-header,
.table-panel.collapsed .table-scroll { opacity: 0; pointer-events: none; }

.table-header {
  padding: 10px 12px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.table-header strong {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-teal);
  font-weight: 500;
}
.table-header-left, .table-header-right { display: flex; align-items: center; gap: 8px; }
#domekCount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: var(--text-dim);
  background: var(--bg);
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
}

.table-scroll { overflow: auto; flex: 1; }

table {
  width: max-content;
  min-width: 0;
  border-collapse: collapse;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  table-layout: auto;
}

thead { position: sticky; top: 0; z-index: 1; }
thead th {
  background: var(--bg);
  color: var(--accent-teal);
  padding: 8px 10px;
  text-align: left;
  font-weight: 500;
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
  width: 1%;
  border-bottom: 1px solid var(--border);
}

thead tr.filter-row th {
  background: var(--bg-elevated);
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
}

.th-label { display: inline-flex; align-items: center; gap: 6px; }

.col-filter {
  width: 100%;
  min-width: 0;
  max-width: 12ch;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 16px;
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg);
  color: var(--text);
}
.col-filter:focus {
  outline: none;
  border-color: var(--accent-teal);
  box-shadow: 0 0 0 2px rgba(94, 234, 212, 0.18);
}

tbody td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  white-space: nowrap;
  width: 1%;
  color: var(--text);
}
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--row-hover); }
tbody tr.selected td { background: var(--row-selected); color: var(--accent-orange); }
tbody tr.selected td:first-child { font-weight: 700; }
tbody tr.hidden-row { display: none; }

.color-swatch {
  width: 11px; height: 11px;
  border-radius: 50%;
  display: inline-block;
  border: 1px solid var(--border-active);
  vertical-align: middle;
  margin-right: 2px;
}

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width: 980px) {
  .main {
    padding: 10px;
    gap: 10px;
  }
  .table-panel {
    position: absolute;
    right: 10px;
    top: 10px;
    bottom: 10px;
    width: min(86vw, 380px);
    max-width: 86vw;
    --table-panel-width: min(86vw, 380px);
    z-index: 500;
    background: var(--bg-elevated);
    box-shadow: -4px 0 24px rgba(0,0,0,0.55);
  }
  .table-panel.collapsed {
    transform: translateX(110%);
    opacity: 0;
  }
  .map-footer { overflow-x: auto; }
  .bracketed { min-height: 44px; padding: 8px 12px; }
  #btnThemeToggle, #btnHelp { width: 44px; min-width: 44px; }
  button.legend-item { min-height: 40px; padding: 8px 12px; }
  #clearSearch { width: 36px; height: 36px; }
  .leaflet-bar a { width: 36px; height: 36px; line-height: 36px; }
  header h1 { font-size: 0.85rem; }
  header { padding: 8px 10px; }
}

/* ── LEAFLET MARKERS ─────────────────────────────────────────── */
.domek-icon {
  display: flex !important;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-family: 'JetBrains Mono', monospace;
  font-size: calc(9.5px * var(--marker-zoom-scale));
  font-weight: 700;
  color: #0a0e1a;
  border: calc(2px * var(--marker-zoom-scale)) solid rgba(10,14,26,0.55);
  cursor: pointer;
  width: calc(26px * var(--marker-zoom-scale)) !important;
  height: calc(26px * var(--marker-zoom-scale)) !important;
  box-shadow: 0 0 calc(10px * var(--glow)) var(--m-color, var(--accent-teal)), 0 2px 4px rgba(0,0,0,0.5);
  transition: transform 0.12s, box-shadow 0.12s;
  user-select: none;
}
.domek-icon:hover {
  transform: scale(1.35) !important;
  z-index: 1500 !important;
}
.domek-icon.selected-marker {
  border-color: var(--accent-orange);
  border-width: calc(3px * var(--marker-zoom-scale));
  transform: scale(1.45) !important;
  box-shadow: 0 0 calc(14px * var(--glow)) var(--accent-orange), 0 0 0 calc(2px * var(--marker-zoom-scale)) var(--accent-orange), 0 2px 6px rgba(0,0,0,0.6);
  z-index: 1400 !important;
}

/* ── LEAFLET TOOLTIP — popup CRT (czytelność > efekciarstwo) ─── */
.leaflet-tooltip.domek-tip {
  background: var(--bg-elevated);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 0.85rem;
  line-height: 1.6;
  box-shadow: 0 4px 18px rgba(0,0,0,0.55);
  white-space: nowrap;
  pointer-events: none;
}
.leaflet-tooltip.domek-tip::before { display: none; }
.domek-tip .tip-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent-teal);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}
.domek-tip .tip-body { font-family: 'Inter', system-ui, sans-serif; }
.domek-tip .tip-row { display: flex; gap: 8px; }
.domek-tip .tip-label { color: var(--text-dim); min-width: 90px; font-size: 0.78rem; }
.domek-tip .tip-val { font-weight: 500; color: var(--text); }

/* ── NO DATA ─────────────────────────────────────────────────── */
.no-data {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
}
</style>
</head>
<body>

<header>
  <h1>
    <span><span class="h-bracket">[</span>czarlina<span class="h-sep"> // </span>mapa<span class="h-bracket">]</span></span>
    <span class="h-sub">Ośrodek Wypoczynkowy &middot; Politechnika Gdańska</span>
  </h1>
  <div class="header-actions">
    <button id="btnHelp" class="bracketed" title="O aplikacji / skróty klawiszowe">?</button>
    <button id="btnThemeToggle" class="bracketed" title="Przełącz tryb jasny/ciemny">
      <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="iconSun"  xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <label class="bracketed" title="Załaduj plik CSV z danymi domków">
      ładuj csv
      <input type="file" id="csvFileInput" accept=".csv" style="display:none">
    </label>
  </div>
</header>

<div class="main">
  <!-- LEFT: MAP -->
  <div class="map-panel section-chrome" id="mapPanel" data-label="mapa">
    <div class="map-toolbar">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="szukaj... (numer, typ, rok, m²)" title="Skrót: /">
        <button id="clearSearch" title="Wyczyść wyszukiwanie (Esc)">×</button>
      </div>
      <div class="toolbar-counter" id="toolbarCounter" title="Widoczne obiekty na mapie">
        <span class="prompt">&gt;</span>
        <span class="num" id="counterNum">0</span>
        <span class="lbl">obiektów</span>
      </div>
      <div class="toolbar-actions">
        <button class="bracketed" id="btnToggleTable" title="Pokaż lub ukryj tabelę">tabela</button>
      </div>
    </div>
    <div id="map"></div>
    <div class="map-footer" id="mapFooter">
      <span class="legend-hint">legenda //</span>
      <button type="button" class="legend-item" data-typ="DP" title="Pokaż/ukryj kategorię DP">
        <span class="legend-dot" style="background:#f97316"></span>
        <span><b>DP</b> Duży z prysznicem i MC</span>
      </button>

function setTableOpen(nextOpen) {
  tableOpen = !!nextOpen;
  tablePanel.classList.toggle('collapsed', !tableOpen);
  btnToggleTable.textContent = tableOpen ? 'Ukryj tabelę' : 'Pokaż tabelę';
  setTimeout(() => map.invalidateSize({ pan: false }), 230);
}

function setTheme(nextDarkMode) {
  isDarkMode = !!nextDarkMode;
  document.body.classList.toggle('light-mode', !isDarkMode);
  document.getElementById('iconSun').style.display  = isDarkMode ? '' : 'none';
  document.getElementById('iconMoon').style.display = isDarkMode ? 'none' : '';
  localStorage.setItem('czarlina-theme', isDarkMode ? 'dark' : 'light');
}

function initTheme() {
  const savedTheme = localStorage.getItem('czarlina-theme');
  if (savedTheme === 'light') return setTheme(false);
  if (savedTheme === 'dark') return setTheme(true);
  // Default: CRT dark
  setTheme(true);
}

function ensureTableOpen() {
  if (!tableOpen) setTableOpen(true);
}

function getColumnFilterValue(key) {
  return (columnFilters[key] || '').trim().toLowerCase();
}

function hasActiveColumnFilters() {
  return Object.values(columnFilters).some(v => String(v || '').trim());
}


function updateMarkerZoomScale() {
  document.body.style.setProperty('--marker-zoom-scale', getMarkerZoomScale(map.getZoom()));
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
//  MARKERY
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function buildMarkers() {
  Object.values(markers).forEach(m => m.remove());
  markers = {};

  domki.forEach(d => {
    const latlng = px(d.x, d.y);
    const icon = L.divIcon({
      className: '',
      html: `<div class="domek-icon" id="mi${d.numer}" style="background:${d.kolor};--m-color:${d.kolor}">${d.numer}</div>`,
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

    const m = L.marker(latlng, { icon, zIndexOffset: 200 })
      .addTo(map)
      .bindTooltip(buildTooltip(d), {
        className: 'domek-tip',
        direction: 'top',
        offset: [0, -14]
      });

    m.on('click', () => selectDomek(d.numer, false));
    markers[d.numer] = m;
  });
}

//  TABELA  (dynamiczne kolumny z CSV)
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function getDisplayCols() {
  if (!domki.length) return [];
  return Object.keys(domki[0]).filter(k => !HIDDEN_COLS.has(k));
}

function buildTableHead() {
  const cols = getDisplayCols();
  const thead = document.getElementById('tableHead');
  thead.innerHTML = '';
  const labelRow = document.createElement('tr');
  const filterRow = document.createElement('tr');
  filterRow.className = 'filter-row';

  cols.forEach((k, i) => {
    const th = document.createElement('th');
    th.innerHTML = `<span class="th-label">${COL_LABELS[k] || k}</span>`;
    if (i === 0) th.style.width = '40px'; // nr
    labelRow.appendChild(th);

    const filterTh = document.createElement('th');
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'col-filter';
    input.placeholder = 'Filtr...';
    input.value = columnFilters[k] || '';
    input.dataset.key = k;
    input.addEventListener('input', () => {
      columnFilters[k] = input.value;
      applyFilter();
    });
    filterTh.appendChild(input);
    filterRow.appendChild(filterTh);

    if (i === 0) {
      const thC = document.createElement('th');
      thC.textContent = 'Kol.';
      thC.style.width = '32px';
      labelRow.appendChild(thC);

      const filterThC = document.createElement('th');
      filterRow.appendChild(filterThC);
    }
  });

  thead.appendChild(labelRow);
  thead.appendChild(filterRow);
}

function buildTableRows() {
  const tbody = document.getElementById('tableBody');
  const cols = getDisplayCols();
  tbody.innerHTML = '';

  domki.forEach(d => {
    const tr = document.createElement('tr');
    tr.dataset.numer = d.numer;
    if (!matchesQuery(d)) tr.classList.add('hidden-row');
    if (d.numer === selectedNumer) tr.classList.add('selected');

    cols.forEach((k, i) => {
      const td = document.createElement('td');
      td.textContent = d[k] !== undefined ? d[k] : '';
      tr.appendChild(td);
      if (i === 0) {
        // Kolumna koloru
        const tdC = document.createElement('td');
        tdC.innerHTML = `<span class="color-swatch" style="background:${d.kolor};border-color:rgba(0,0,0,0.2)"></span>`;
        tr.appendChild(tdC);
      }
    });

    tr.addEventListener('click', () => selectDomek(d.numer, true));
    tbody.appendChild(tr);
  });

  updateCount();
}

function updateCount() {
  const visible = domki.filter(matchesQuery).length;
  document.getElementById('domekCount').textContent =
    (query || hasActiveColumnFilters()) ? `${visible} / ${domki.length}` : `${domki.length} domków`;

  // Toolbar counter (zawsze widoczny)
  const counterEl = document.getElementById('toolbarCounter');
  const counterNum = document.getElementById('counterNum');
  if (counterEl && counterNum) {
    const isFiltered = visible !== domki.length;
    counterEl.classList.toggle('filtered', isFiltered);
    counterNum.textContent = isFiltered ? `${visible}/${domki.length}` : String(domki.length);
  }
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
//  FILTROWANIE
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function matchesQuery(d) {
  if (disabledTypes.has(d.typ)) return false;

  const matchesGlobal = !query || Object.entries(d)
    .filter(([k]) => !HIDDEN_COLS.has(k))
    .some(([, v]) => String(v).toLowerCase().includes(query.toLowerCase()));

  if (!matchesGlobal) return false;

  return getDisplayCols().every((key) => {
    const filterValue = getColumnFilterValue(key);
    if (!filterValue) return true;
    return String(d[key] ?? '').toLowerCase().includes(filterValue);
  });
}

function applyFilter() {
  domki.forEach(d => {
    const show = matchesQuery(d);
    // Marker
    const el = document.getElementById(`mi${d.numer}`);
    if (el) {
      const wrapper = el.closest('.leaflet-marker-icon') || el.parentElement;
      if (wrapper) wrapper.style.display = show ? '' : 'none';
    }
    // Wiersz tabeli
    const row = document.querySelector(`#tableBody tr[data-numer="${d.numer}"]`);
    if (row) row.classList.toggle('hidden-row', !show);
  });
  updateCount();
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
//  SELEKCJA
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function selectDomek(numer, panTo) {
  // Odznacz poprzedni
  if (selectedNumer !== null) {
    const prevEl = document.getElementById(`mi${selectedNumer}`);
    if (prevEl) prevEl.classList.remove('selected-marker');
    const prevRow = document.querySelector(`#tableBody tr[data-numer="${selectedNumer}"]`);
    if (prevRow) prevRow.classList.remove('selected');
  }

  selectedNumer = numer;
  ensureTableOpen();

  // Zaznacz marker
  const el = document.getElementById(`mi${numer}`);
  if (el) el.classList.add('selected-marker');

  // Zaznacz i przewiĹ„ wiersz tabeli
  const row = document.querySelector(`#tableBody tr[data-numer="${numer}"]`);
  if (row) {
    row.classList.add('selected');
    row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // PrzesuĹ„ mapÄ™ (gdy klikniÄ™to z tabeli)
  if (panTo && markers[numer]) {
    map.panTo(markers[numer].getLatLng(), { animate: true, duration: 0.4 });
  }
}

// UX #1: klikalna legenda — toggle widoczności kategorii
document.querySelectorAll('button.legend-item[data-typ]').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.typ;
    if (disabledTypes.has(t)) {
      disabledTypes.delete(t);
      btn.classList.remove('disabled');
      btn.setAttribute('aria-pressed', 'false');
    } else {
      disabledTypes.add(t);
      btn.classList.add('disabled');
      btn.setAttribute('aria-pressed', 'true');
    }
    applyFilter();
  });
});

// UX #2: skrót klawiszowy '/' do focusu search, Esc czyści
document.addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  const inField = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);

  if (e.key === '/' && !inField) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  } else if (e.key === 'Escape') {
    if (ae === searchInput) {
      if (searchInput.value) {
        searchInput.value = '';
        query = '';
        clearBtn.style.display = 'none';
        applyFilter();
      } else {
        searchInput.blur();
      }
    }
  }
});

const CSV_SOURCE = 'data/domki_clean.csv';

async function loadInitialCSV() {
  try {
    const response = await fetch(CSV_SOURCE, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const text = await response.text();
    const parsed = parseCSV(text);
    if (!parsed.length) throw new Error('empty csv');
    loadData(parsed);
  } catch (err) {
    console.error(`Nie udało się automatycznie wczytać ${CSV_SOURCE}.`, err);
    alert(`Nie udało się wczytać pliku ${CSV_SOURCE}. Użyj przycisku "Załaduj CSV" albo uruchom stronę z lokalnego serwera.`);
  }
}

document.getElementById('csvFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const parsed = parseCSV(ev.target.result);
    if (!parsed.length) { alert('Nie udało się wczytać danych z pliku CSV.'); return; }
    loadData(parsed);
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
});

  domki = data.map(normalizeDomek).slice().sort((a, b) => a.numer - b.numer);
